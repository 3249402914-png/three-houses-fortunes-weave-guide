name: Publish guide website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          python3 -m zipfile -e site.zip public
          touch public/.nojekyll
          test -f public/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.3 >/dev/null 2>&1; then
            echo "Release v1.0.3 already exists"
          else
            gh release create v1.0.3 three-houses-fortunes-weave-guide-1.0.3.apk SHA256SUMS.txt site.zip --title "风花雪月与万缕千丝攻略 1.0.3" --notes "《火焰纹章 风花雪月》与《火焰纹章 万缕千丝》非官方中文攻略。Android 8.0 起，支持离线使用，可覆盖旧版保留记录。site.zip 为网页运行文件。完整版源码未公开。"
          fi
